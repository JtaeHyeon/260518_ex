<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>THyeon의 포트폴리오 웹사이트</title>
    <!-- 검색 등에 노출되는 데이터(뉴스 등에서 많이 사용됨)-->
    <meta name="description" content=" 저의 기술을 보여드리죠!" />

    <!-- og tag-->
    <!-- https://jtaehyeon.github.io/260518_ex/ -->
    <meta property="og:title" content="TH의 포폴사이트" />
    <meta property="og:description" content="백엔드 취업 목표" />
    <meta property="og:url" content="https://jtaehyeon.github.io/260518_ex/" />
    <meta
      property="og:image"
      content="https://jtaehyeon.github.io/260518_ex/og_preview3.jpg"
    />

    <!-- favicon : 웹사이트를 대표하는 아이콘-->
    <link
      rel="icon"
      type="image/png"
      href="./favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="MyWebSite" />
    <link rel="manifest" href="./site.webmanifest" />

    <style>
      /* 폰트 변경은 이곳에 font-family 형태로 하면 좋음 */
      /*
         h1,
         h2,
         h3,
         h4,
         h5,
         h6 { font-family: " sans-serif;"
          }
         의 형태로 지정 가능 */

      /* 웹폰트 사용시 복사 붙여넣기 해서
         import url (""); 형태 복사해온 후
         body {
          font-family : "복사해온 웹폰트명"; 
         } 
        의 형태로 저장
         */
      @font-face {
        font-family: "Cafe24Surround";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/Cafe24Ssurround.woff")
          format("woff");
        font-weight: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "KkuBulLim";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2410-1@1.0/BMkkubulimTTF-Regular.woff2")
          format("woff2");
        font-weight: normal;
        font-display: swap;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: "Cafe24Surround";
        color: #111827;
      }

      strong {
        font-family: "KkuBulLim";
      }

      body {
        margin: 0;
        padding: 40px 20px;
        background: radial-gradient(circle at top right, #f3f4f6, #e5e7eb);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        color: #374151;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        max-width: 600px;
        width: 100%;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 24px;
        padding: 40px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        backdrop-filter: blur(20px);
      }

      h1 {
        font-size: 2.5rem;
        margin-top: 0;
        margin-bottom: 10px;
        background: linear-gradient(135deg, #1f2937, #074ca1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      h3 {
        font-size: 1.25rem;
        font-weight: normal;
        margin-bottom: 20px;
        color: #4b5563;
      }

      p {
        line-height: 1.6;
        color: #4b5563;
        margin-bottom: 24px;
      }

      .contact-strong {
        font-size: 1.1rem;
        color: #074ca1;
        border-bottom: 2px solid #074ca1;
        padding-bottom: 2px;
      }

      /* Premium Card Link Style */
      .sports-card {
        margin-top: 30px;
        padding: 24px;
        border-radius: 16px;
        background: linear-gradient(
          135deg,
          rgba(7, 76, 161, 0.03),
          rgba(7, 76, 161, 0.08)
        );
        border: 1px solid rgba(7, 76, 161, 0.1);
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      }

      .sports-card:hover {
        transform: translateY(-4px);
        border-color: rgba(7, 76, 161, 0.3);
        box-shadow: 0 12px 24px -10px rgba(7, 76, 161, 0.25);
        background: linear-gradient(
          135deg,
          rgba(7, 76, 161, 0.06),
          rgba(7, 76, 161, 0.12)
        );
      }

      .sports-card-content {
        flex: 1;
      }

      .sports-card h4 {
        margin: 0 0 6px 0;
        color: #074ca1;
        font-size: 1.25rem;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .sports-card p {
        margin: 0;
        font-size: 0.95rem;
        color: #4b5563;
        line-height: 1.4;
      }

      .sports-card-arrow {
        color: #074ca1;
        font-size: 1.5rem;
        transition: transform 0.3s ease;
        padding-left: 15px;
      }

      .sports-card:hover .sports-card-arrow {
        transform: translateX(5px);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>저는 태현입니다.</h1>
      <h3>개발자가 되기 위해 열심히 공부하고 있습니다.</h3>
      <p>프로그래밍에 열정을 다하며, 기술을 발전시키고 있습니다.</p>
      <p>
        제 번호는 <strong class="contact-strong">010-1234-5678</strong>입니다.
        편하게 연락주세요!
      </p>

      <a href="baseball.html" class="sports-card">
        <div class="sports-card-content">
          <h4>⚾ My Favorite Sports: 야구</h4>
          <p>
            삼성 라이온즈의 푸른 투혼과 찬란한 왕조, 그리고 야구의 기본적인 룰을
            소개합니다.
          </p>
        </div>
        <div class="sports-card-arrow">➔</div>
      </a>
    </div>
  </body>
</html>
