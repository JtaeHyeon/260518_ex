<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>THyeon의 포트폴리오 웹사이트</title>
    <!-- 검색 등에 노출되는 데이터(뉴스 등에서 많이 사용됨)-->
    <meta name="description" content=" 저의 기술을 보여드리죠!" />

    <!-- og tag-->
    <!-- https://jtaehyeon.github.io/260518_ex/ -->
    <meta property="og:title" content="TH의 포폴사이트" />
    <meta property="og:description" content="백엔드 취업 목표" />
    <meta
      property="og:url"
      content="https://jtaehyeon.github.io/260518_ex/06_deploy.html"
    />
    <meta
      property="og:img"
      content="https://jtaehyeon.github.io/260518_ex/og_preview.png"
    />

    <!-- favicon : 웹사이트를 대표하는 아이콘-->
    <link
      rel="icon"
      type="image/png"
      href="./favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="MyWebSite" />
    <link rel="manifest" href="./site.webmanifest" />

    <style>
      /* 폰트 변경은 이곳에 font-family 형태로 하면 좋음 */
      /*
         h1,
         h2,
         h3,
         h4,
         h5,
         h6 { font-family: " sans-serif;"
          }
         의 형태로 지정 가능 */

      /* 웹폰트 사용시 복사 붙여넣기 해서
         import url (""); 형태 복사해온 후
         body {
          font-family : "복사해온 웹폰트명"; 
         } 
        의 형태로 저장
         */
      @font-face {
        font-family: "Cafe24Surround";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/Cafe24Ssurround.woff")
          format("woff");
        font-weight: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "KkuBulLim";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2410-1@1.0/BMkkubulimTTF-Regular.woff2")
          format("woff2");
        font-weight: normal;
        font-display: swap;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: "Cafe24Surround";
      }

      strong {
        font-family: "KkuBulLim";
      }
    </style>
  </head>
  <body>
    <h1>저는 태현입니다.</h1>
    <h3>개발자가 되기 위해 열심히 공부하고 있습니다.</h3>
    <p>열심히 공부하고 있습니다.</p>
    <p>제 번호는 <strong> 010-1234-5678 </strong>입니다. 연락주세요!</p>

    <br />
    <br />
  </body>
</html>
